<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Từ Vựng Flashcard 3D | EduMaster English</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#f7f8f6] dark:bg-[#111722] text-slate-800 dark:text-slate-100 flex flex-col min-h-screen">

  <header id="main-header"></header>

  <main class="flex-grow py-8 sm:py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">

      <!-- Header -->
      <div class="text-center mb-8">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-100 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 text-xs font-bold mb-3">
          🗂 Phương Pháp Spaced Repetition
        </span>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white mb-2">
          Flashcard 3D Ghi Nhớ Từ Vựng
        </h1>
        <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm max-w-lg mx-auto">
          Lật thẻ, luyện nghe phát âm chuẩn giọng bản xứ và đánh dấu tiến trình ghi nhớ từ vựng theo từng cấp độ CEFR.
        </p>
      </div>

      <!-- Level Switcher -->
      <div class="flex items-center justify-center gap-2 flex-wrap mb-8" id="flashcard-level-tabs">
        <!-- Rendered by flashcards.js -->
      </div>

      <!-- Mastery Progress Indicator -->
      <div class="max-w-lg mx-auto mb-6 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 mb-2">
          <span>Tiến độ ghi nhớ từ vựng</span>
          <span id="flashcard-mastery-text">Đã thuộc 0 / 0 từ</span>
        </div>
        <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="flashcard-mastery-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: 0%;"></div>
        </div>
      </div>

      <!-- 3D Flashcard Display Area -->
      <div id="flashcard-wrapper" class="mb-6">
        <!-- Rendered dynamically by flashcards.js -->
      </div>

      <!-- Controls: Navigation & Mastery Buttons -->
      <div class="max-w-lg mx-auto space-y-4">
        <!-- Mastery actions -->
        <div class="grid grid-cols-2 gap-3">
          <button 
            onclick="markCardMastery('review')" 
            class="py-3 px-4 rounded-2xl border-2 border-amber-300 dark:border-amber-800 bg-amber-50 dark:bg-amber-950/30 text-amber-800 dark:text-amber-300 font-bold text-sm hover:bg-amber-100 dark:hover:bg-amber-900/50 transition-colors flex items-center justify-center gap-2 shadow-sm">
            <span>🤔 Cần ôn lại</span>
          </button>
          <button 
            onclick="markCardMastery('mastered')" 
            class="py-3 px-4 rounded-2xl bg-emerald-600 text-white font-bold text-sm shadow-md shadow-emerald-600/30 hover:bg-emerald-700 transition-colors flex items-center justify-center gap-2">
            <span>✓ Đã thuộc (+10 XP)</span>
          </button>
        </div>

        <!-- Prev / Next Navigation -->
        <div class="flex items-center justify-between pt-2">
          <button 
            onclick="prevCard()" 
            class="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 font-semibold text-xs hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            ← Thẻ trước (Phím ←)
          </button>
          <button 
            onclick="flipCard()" 
            class="px-4 py-2.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 font-semibold text-xs hover:bg-indigo-100 transition-colors">
            Lật thẻ (Phím Space)
          </button>
          <button 
            onclick="nextCard()" 
            class="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 font-semibold text-xs hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
            Thẻ sau (Phím →) →
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/flashcards.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Đọc Hiểu & Trả Lời Câu Hỏi | EduMaster English</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#f7f8f6] dark:bg-[#111722] text-slate-800 dark:text-slate-100 flex flex-col min-h-screen">

  <header id="main-header"></header>

  <main class="flex-grow py-8 sm:py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Section Header -->
      <div class="text-center max-w-2xl mx-auto mb-8">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-yellow-50 dark:bg-yellow-950/60 text-yellow-700 dark:text-yellow-300 text-xs font-bold mb-3 border border-yellow-200/60 dark:border-yellow-800/60">
          📰 Reading Comprehension
        </span>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white mb-2">
          Luyện Đọc Hiểu & Trả Lời Câu Hỏi
        </h1>
        <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm leading-relaxed">
          Đọc các đoạn văn ngẫu nhiên từ A1 đến C2, trau dồi ngữ pháp, từ vựng và kiểm tra độ hiểu văn bản qua các câu hỏi trắc nghiệm có phản hồi tức thì.
        </p>
      </div>

      <!-- Action Card -->
      <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-sm border border-slate-200/80 dark:border-slate-800 p-6 sm:p-8 mb-8">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-5 border-b border-slate-100 dark:border-slate-800">
          <button id="new-passage-btn" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-yellow-600 text-white font-bold text-sm shadow-md shadow-yellow-600/30 hover:bg-yellow-700 hover:-translate-y-0.5 transition-all">
            🎲 Đổi Đoạn Văn Ngẫu Nhiên
          </button>
          <span id="passage-count" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
            Đang tải dữ liệu...
          </span>
        </div>

        <div id="passage-container" class="mb-8"></div>
        <div id="questions-container" class="space-y-6"></div>
        <div id="result-summary" class="mt-8"></div>
      </div>

    </div>
  </main>

  <footer id="main-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/reading-data.js"></script>
  <script src="assets/js/reading.js"></script>
</body>
</html>
